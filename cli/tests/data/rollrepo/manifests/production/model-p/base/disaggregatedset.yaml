apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: model-p
spec:
  roles:
    - name: prefill
      spec:
        replicas: 4
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 2
        leaderWorkerTemplate:
          size: 2
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/role: prefill
                ops.llm-d.ai/production-released: "true"
            spec:
              containers:
                - name: vllm
                  image: registry.example.invalid/vllm:v1
                  resources:
                    limits:
                      nvidia.com/gpu: "8"
    - name: decode
      spec:
        replicas: 3
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 2
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/role: decode
                ops.llm-d.ai/production-released: "true"
            spec:
              containers:
                - name: vllm
                  image: registry.example.invalid/vllm:v1
                  resources:
                    limits:
                      nvidia.com/gpu: "8"
