# Typos configuration
# https://github.com/crate-ci/typos

[default.extend-words]
# Azure Kubernetes Service abbreviation
AKS = "AKS"
aks = "aks"
# Indian Standard Time / Istio abbreviation
IST = "IST"
# Abbreviation (e.g., 2nd -> ND)
ND = "ND"
# Mean Absolute Percentage Error — standard forecasting metric used in
# specs/changes/predicted-latency/ callouts.
MAPE = "MAPE"

# Add repo-specific false positives here:
# word = "word"
# False positives from nightly typo scan (#2)
# Last-4-chars API key preview (e.g. sk-secret-value -> ...alue)
alue = "alue"
# bash shell-detection regex: (?:ba)?sh$ matches sh and bash intentionally
ba = "ba"
