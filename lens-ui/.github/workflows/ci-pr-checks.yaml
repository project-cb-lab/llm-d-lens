name: CI - PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main

jobs:
  english-content:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test English checker
        run: npm run test:english
      - name: Check repository and PR text
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          npm run check:english -- --text-file "$RUNNER_TEMP/pr-title.txt" --text-file "$RUNNER_TEMP/pr-body.md"

  # Detect if PR contains code changes (skip expensive checks for docs-only PRs)
  check-code-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_code_changes: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check for code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  # Release-time gate: the pinned llm-d stack must be internally consistent and
  # every referenced version must exist (llm_d_bench/versions/llm_d_stack.yaml).
  llm-d-stack:
    runs-on: ubuntu-latest
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the stack checker
        run: npm run test:stack

      - name: Validate the pinned llm-d stack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:stack

  # Validate the actual frontend and Node API instead of the old Go placeholder.
  frontend-and-server:
    runs-on: ubuntu-latest
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Python for the MCP catalog
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate MCP catalog
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
          node scripts/generate-mcp-tools.mjs

      - name: Type check
        run: npm run type-check

      - name: Test
        run: make test-js

  # Python: lint (only if Python files exist)
  python-lint:
    runs-on: ubuntu-latest
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check for Python files
        id: check-python
        run: |
          if find . -name "*.py" -not -path "./.git/*" | head -1 | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        if: steps.check-python.outputs.has_python == 'true'
        run: pip install ruff

      - name: Run ruff check
        if: steps.check-python.outputs.has_python == 'true'
        run: ruff check .

      - name: Run ruff format check
        if: steps.check-python.outputs.has_python == 'true'
        run: ruff format --check .

  # Container: build (no push) to validate Dockerfile
  container-build:
    runs-on: ubuntu-latest
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag test-build:pr-${{ github.event.pull_request.number }} \
            .
