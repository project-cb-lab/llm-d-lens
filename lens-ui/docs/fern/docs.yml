# Lens documentation site (Fern).
#
# Pages live next to the repository documentation they describe: most entries
# point at the existing files under docs/ through relative paths, so the design
# docs stay canonical and no tooling path (for example the generated
# docs/reuse-map.md) moves. New site-only pages live in ./pages.
#
# One flat sidebar (no top tab bar), matching the GPUStack docs site layout:
# Home, Overview, Quickstart, Installation, Upgrade, Migration, User Guide,
# Tutorials, Integrations, Architecture, Scheduler,
# Troubleshooting, FAQ, API Reference, CLI Reference, Environment Variables —
# followed by supplementary contributor/design-reference sections that have
# no GPUStack equivalent.
instances:
  - url: llm-d-lens.docs.buildwithfern.com

title: Lens Documentation

# Let the layout span the full viewport and let the article column grow with
# it. Fern defaults are page-width 88rem (1408px) and content-width 44rem
# (704px); page-width: full alone leaves the article capped at 44rem.
# content-width takes only a rem/px value. Fern stays responsive either way.
layout:
  page-width: full
  content-width: 100rem

css: ./styles.css

landing-page:
  page: Home
  path: ./pages/home.mdx
  slug: /

logo:
  light: ./assets/lens_logo.png
  dark: ./assets/lens_logo.png
  height: 32
  href: /

favicon: ../../public/favicon.png

navbar-links:
  - type: github
    value: https://github.com/intel-sandbox/llm-d-prism

colors:
  # Palette and surfaces.
  # Light: accent #0046c8, subtle surface #eef4fe, hairline #cdd8ea on white.
  # Dark:  navy page #000f28, subtle surface #061b3d, hairline #20304b,
  #        accent #4DB8FF (meets WCAG AAA on navy).
  accent-primary:
    light: "#0046c8"
    dark: "#4DB8FF"
  background:
    light: "#ffffff"
    dark: "#000f28"
  header-background:
    light: "#ffffff"
    dark: "#000f28"
  sidebar-background:
    light: "#ffffff"
    dark: "#000f28"
  card-background:
    light: "#eef4fe"
    dark: "#061b3d"
  border:
    light: "#cdd8ea"
    dark: "#20304b"

